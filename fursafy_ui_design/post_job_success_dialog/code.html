<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Job Posted Success | Fursafy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#faf9f4",
                      "surface-container-high": "#e9e8e3",
                      "secondary-fixed": "#ffddb7",
                      "tertiary-fixed": "#ffdad6",
                      "on-error-container": "#93000a",
                      "inverse-surface": "#2f312d",
                      "surface-bright": "#faf9f4",
                      "surface-tint": "#006c4e",
                      "outline-variant": "#bccac1",
                      "surface-container-highest": "#e3e3dd",
                      "surface-dim": "#dbdad5",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed-variant": "#00513a",
                      "error": "#ba1a1a",
                      "tertiary": "#993f3a",
                      "primary-fixed-dim": "#68dbae",
                      "surface-container": "#efeee9",
                      "on-secondary-fixed-variant": "#653e00",
                      "on-secondary-fixed": "#2a1700",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-container": "#fffbff",
                      "tertiary-container": "#b85751",
                      "on-error": "#ffffff",
                      "primary-container": "#008560",
                      "primary": "#00694c",
                      "secondary-container": "#fcaa33",
                      "inverse-primary": "#68dbae",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#86f8c9",
                      "surface-container-low": "#f4f4ee",
                      "surface-variant": "#e3e3dd",
                      "error-container": "#ffdad6",
                      "background": "#faf9f4",
                      "on-background": "#1a1c19",
                      "secondary": "#855400",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed-variant": "#7e2a27",
                      "tertiary-fixed-dim": "#ffb3ad",
                      "on-tertiary-fixed": "#410003",
                      "on-primary-fixed": "#002115",
                      "on-secondary-container": "#6b4200",
                      "outline": "#6d7a73",
                      "secondary-fixed-dim": "#ffb95d",
                      "on-surface": "#1a1c19",
                      "on-surface-variant": "#3d4943",
                      "inverse-on-surface": "#f1f1eb",
                      "on-primary-container": "#f5fff7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "xxl": "1.5rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed overflow-hidden">
<!-- Success Page Content (Contextual Background) -->
<main class="relative min-h-screen flex items-center justify-center p-6">
<!-- Blurred Background Content to provide context of the app underneath -->
<div class="absolute inset-0 z-0 opacity-40 blur-md pointer-events-none p-8">
<div class="max-w-4xl mx-auto space-y-8">
<div class="h-12 w-48 bg-surface-container-high rounded-full"></div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="h-64 bg-surface-container-low rounded-xxl"></div>
<div class="h-64 bg-surface-container-low rounded-xxl"></div>
</div>
<div class="h-96 bg-surface-container-low rounded-xxl"></div>
</div>
</div>
<!-- Dimmed Overlay -->
<div class="fixed inset-0 bg-on-surface/20 backdrop-blur-[2px] z-10 transition-opacity"></div>
<!-- Success Dialog -->
<div class="relative z-20 w-full max-w-md transform transition-all">
<div class="bg-surface-container-lowest rounded-xxl p-8 shadow-[0_32px_64px_-12px_rgba(0,105,76,0.08)] flex flex-col items-center text-center">
<!-- Success Icon with Radial Glow -->
<div class="relative mb-8">
<div class="absolute inset-0 bg-primary/10 rounded-full scale-150 blur-xl"></div>
<div class="relative bg-primary-container text-on-primary-container h-20 w-20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined !text-4xl" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Messaging -->
<div class="space-y-3 mb-10">
<h1 class="text-3xl font-extrabold tracking-tight text-primary">
                        Job Posted!
                    </h1>
<p class="text-on-surface-variant font-body text-lg leading-relaxed px-4">
                        We'll notify matching youth workers.
                    </p>
</div>
<!-- CTA Section -->
<div class="w-full flex flex-col gap-3">
<button class="w-full py-4 px-6 bg-primary text-on-primary font-bold rounded-full flex items-center justify-center gap-2 hover:bg-primary-container transition-all active:scale-[0.98]">
<span>Go to My Jobs</span>
<span class="material-symbols-outlined !text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full py-3 px-6 text-primary font-bold rounded-full hover:bg-surface-container-low transition-colors">
                        Post another job
                    </button>
</div>
<!-- Secondary Accents / Youth Engagement Indicator -->
<div class="mt-8 pt-8 border-t border-outline-variant/10 w-full">
<div class="flex items-center justify-center gap-2 text-xs font-semibold text-secondary uppercase tracking-[0.1em]">
<span class="h-1.5 w-1.5 rounded-full bg-secondary-container"></span>
<span>Fursafy growth engine active</span>
<span class="h-1.5 w-1.5 rounded-full bg-secondary-container"></span>
</div>
</div>
</div>
<!-- Asymmetric Decorative Element for Editorial feel -->
<div class="absolute -top-6 -right-6 h-12 w-12 bg-secondary-container rounded-full flex items-center justify-center shadow-lg transform rotate-12">
<span class="material-symbols-outlined text-on-secondary-container" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
</div>
</main>
<!-- Success Illustration Background (Subtle) -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-1/2 opacity-20 pointer-events-none">
<div class="absolute inset-0 bg-gradient-to-bl from-primary/20 to-transparent blur-[120px]"></div>
</div>
<div class="fixed bottom-0 left-0 -z-10 w-1/3 h-1/2 opacity-20 pointer-events-none">
<div class="absolute inset-0 bg-gradient-to-tr from-secondary-container/20 to-transparent blur-[120px]"></div>
</div>
</body></html>
