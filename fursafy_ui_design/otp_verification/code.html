<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Verify Your Identity - Fursafy</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface": "#faf9f4",
                      "surface-container-high": "#e9e8e3",
                      "secondary-fixed": "#ffddb7",
                      "tertiary-fixed": "#ffdad6",
                      "on-error-container": "#93000a",
                      "inverse-surface": "#2f312d",
                      "surface-bright": "#faf9f4",
                      "surface-tint": "#006c4e",
                      "outline-variant": "#bccac1",
                      "surface-container-highest": "#e3e3dd",
                      "surface-dim": "#dbdad5",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed-variant": "#00513a",
                      "error": "#ba1a1a",
                      "tertiary": "#993f3a",
                      "primary-fixed-dim": "#68dbae",
                      "surface-container": "#efeee9",
                      "on-secondary-fixed-variant": "#653e00",
                      "on-secondary-fixed": "#2a1700",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-container": "#fffbff",
                      "tertiary-container": "#b85751",
                      "on-error": "#ffffff",
                      "primary-container": "#008560",
                      "primary": "#00694c",
                      "secondary-container": "#fcaa33",
                      "inverse-primary": "#68dbae",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed": "#86f8c9",
                      "surface-container-low": "#f4f4ee",
                      "surface-variant": "#e3e3dd",
                      "error-container": "#ffdad6",
                      "background": "#faf9f4",
                      "on-background": "#1a1c19",
                      "secondary": "#855400",
                      "on-primary": "#ffffff",
                      "on-tertiary-fixed-variant": "#7e2a27",
                      "tertiary-fixed-dim": "#ffb3ad",
                      "on-tertiary-fixed": "#410003",
                      "on-primary-fixed": "#002115",
                      "on-secondary-container": "#6b4200",
                      "outline": "#6d7a73",
                      "secondary-fixed-dim": "#ffb95d",
                      "on-surface": "#1a1c19",
                      "on-surface-variant": "#3d4943",

              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Manrope"],
                      "label": ["Manrope"]
              }
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #faf9f4;
            font-family: 'Manrope', sans-serif;
        }
        .otp-glow:focus {
            box-shadow: 0 0 0 2px #00694c;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Anchor (Shared Component Mapping) -->
<header class="bg-[#faf9f4]/80 backdrop-blur-xl docked full-width top-0 sticky z-50 flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-neutral-500">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-black tracking-tight text-[#00694c]">Fursafy</h1>
</div>
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-neutral-500 hover:bg-neutral-200/50 p-2 rounded-full transition-colors">help_outline</span>
</div>
</header>
<main class="flex-grow flex flex-col items-center px-6 pt-12 pb-24 md:pt-24">
<!-- Editorial Headline Section -->
<div class="w-full max-w-md mb-12">
<div class="inline-flex items-center gap-2 px-3 py-1 bg-secondary-fixed rounded-full mb-6">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label text-[11px] font-bold uppercase tracking-wider text-on-secondary-fixed">Security First</span>
</div>
<h2 class="font-headline font-extrabold text-4xl leading-tight tracking-tight mb-4 text-primary">
                Verify your <br/>account
            </h2>
<p class="font-body text-on-surface-variant leading-relaxed">
                We've sent a 6-digit verification code to your registered mobile number ending in <span class="font-bold text-on-surface">•••• 4829</span>.
            </p>
</div>
<!-- Input Section -->
<div class="w-full max-w-md space-y-10">
<div class="flex justify-between gap-2 md:gap-4">
<!-- 6-digit input boxes -->
<input class="w-12 h-16 md:w-16 md:h-20 text-center text-2xl font-headline font-bold bg-surface-container-highest rounded-xl border-none focus:bg-surface-container-low focus:ring-0 otp-glow transition-all" maxlength="1" type="text" value="4"/>
<input class="w-12 h-16 md:w-16 md:h-20 text-center text-2xl font-headline font-bold bg-surface-container-highest rounded-xl border-none focus:bg-surface-container-low focus:ring-0 otp-glow transition-all" maxlength="1" type="text" value="8"/>
<input autofocus="" class="w-12 h-16 md:w-16 md:h-20 text-center text-2xl font-headline font-bold bg-surface-container-highest rounded-xl border-none focus:bg-surface-container-low focus:ring-0 otp-glow transition-all" maxlength="1" type="text"/>
<input class="w-12 h-16 md:w-16 md:h-20 text-center text-2xl font-headline font-bold bg-surface-container-highest rounded-xl border-none focus:bg-surface-container-low focus:ring-0 otp-glow transition-all" maxlength="1" type="text"/>
<input class="w-12 h-16 md:w-16 md:h-20 text-center text-2xl font-headline font-bold bg-surface-container-highest rounded-xl border-none focus:bg-surface-container-low focus:ring-0 otp-glow transition-all" maxlength="1" type="text"/>
<input class="w-12 h-16 md:w-16 md:h-20 text-center text-2xl font-headline font-bold bg-surface-container-highest rounded-xl border-none focus:bg-surface-container-low focus:ring-0 otp-glow transition-all" maxlength="1" type="text"/>
</div>
<!-- Interaction Section -->
<div class="space-y-6">
<button class="w-full bg-primary text-on-primary font-headline font-bold py-5 rounded-full shadow-lg shadow-primary/10 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                    Verify Code
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<div class="flex flex-col items-center gap-3">
<p class="font-label text-sm text-on-surface-variant">
                        Didn't receive the code?
                    </p>
<div class="flex items-center gap-2 px-5 py-2 bg-surface-container rounded-full">
<span class="material-symbols-outlined text-[18px] text-secondary">history</span>
<span class="font-label text-xs font-bold text-on-surface">Resend code in 00:59</span>
</div>
</div>
</div>
</div>
<!-- Decorative Curator Element (Editorial Detail) -->
<div class="mt-auto pt-16 w-full max-w-md opacity-40">
<div class="h-[1px] w-full bg-gradient-to-r from-transparent via-outline-variant to-transparent mb-8"></div>
<div class="flex items-center justify-center gap-8">
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary">verified_user</span>
<span class="text-[10px] uppercase font-bold tracking-tighter text-on-surface-variant">Secure Session</span>
</div>
<div class="flex flex-col items-center gap-1">
<span class="material-symbols-outlined text-primary">encrypted</span>
<span class="text-[10px] uppercase font-bold tracking-tighter text-on-surface-variant">End-to-End</span>
</div>
</div>
</div>
</main>
<!-- Contextual Asymmetric Graphic (Editorial Style) -->
<div class="fixed top-1/4 -right-24 w-64 h-64 bg-primary-fixed/20 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-0 -left-12 w-48 h-48 bg-secondary-fixed/30 rounded-full blur-[80px] pointer-events-none -z-10"></div>
<!-- Background texture div (Subtle Editorial Depth) -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-overlay -z-20">
<div class="w-full h-full bg-[radial-gradient(#00694c_1px,transparent_1px)] [background-size:20px_20px]"></div>
</div>
</body></html>
