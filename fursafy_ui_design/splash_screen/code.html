<body class="bg-surface text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
<main class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden px-6">
<!-- Background Editorial Elements -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-32 -right-32 w-[32rem] h-[32rem] bg-secondary-container/10 rounded-full blur-3xl"></div>
<!-- Image Decoration: Editorial Abstract Shape -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg aspect-square opacity-20 pointer-events-none">
<div class="w-full h-full rounded-[2rem] rotate-12 border-[1.5px] border-primary/20 scale-110"></div>
<div class="absolute inset-0 rounded-[3rem] -rotate-6 border-[1px] border-secondary/20 scale-105"></div>
</div>
<!-- Branding Section -->
<div class="relative z-10 flex flex-col items-center text-center">
<!-- Logo Icon with Gradient & Shadow -->
<div class="mb-10 relative">
<div class="w-24 h-24 hero-gradient rounded-[2rem] flex items-center justify-center shadow-xl shadow-primary/20 transform -rotate-3 transition-transform hover:rotate-0">
<span class="material-symbols-outlined text-on-primary text-5xl" style="font-variation-settings: 'FILL' 1;">
                        trending_up
                    </span>
</div>
<!-- Subtle Secondary Accent Dot -->
<div class="absolute -top-2 -right-2 w-6 h-6 bg-secondary-container rounded-full border-4 border-surface shadow-sm"></div>
</div>
<!-- Brand Name -->
<h1 class="font-headline font-black text-6xl tracking-tighter text-primary mb-4">
                Fursafy
            </h1>
<!-- Tagline with Editorial Spacing -->
<p class="font-body text-on-surface-variant text-lg font-medium tracking-tight max-w-[200px] leading-relaxed">
                Your opportunity, one tap away
            </p>
</div>
<!-- Background Image Accent (Subtle, professional) -->
<div class="absolute bottom-12 w-full flex justify-center px-8 opacity-40">
<div class="w-full max-w-sm h-1 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-1/3 bg-primary rounded-full animate-[loading_2s_infinite_ease-in-out]"></div>
</div>
</div>
