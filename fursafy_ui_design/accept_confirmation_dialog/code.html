<!DOCTYPE html>

<html lang="en"><head>

                    "secondary-fixed": "#ffddb7",

                    "on-error-container": "#93000a",
                    "inverse-surface": "#2f312d",
                    "surface-bright": "#faf9f4",
                    "surface-tint": "#006c4e",
                    "outline-variant": "#bccac1",
                    "surface-container-highest": "#e3e3dd",
                    "surface-dim": "#dbdad5",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#00513a",
                    "error": "#ba1a1a",
                    "tertiary": "#993f3a",
                    "primary-fixed-dim": "#68dbae",
                    "surface-container": "#efeee9",
                    "on-secondary-fixed-variant": "#653e00",
                    "on-secondary-fixed": "#2a1700",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-container": "#fffbff",
                    "tertiary-container": "#b85751",
                    "on-error": "#ffffff",
                    "primary-container": "#008560",
                    "primary": "#00694c",
                    "secondary-container": "#fcaa33",
                    "inverse-primary": "#68dbae",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed": "#86f8c9",
                    "surface-container-low": "#f4f4ee",
                    "surface-variant": "#e3e3dd",
                    "error-container": "#ffdad6",

                    "on-tertiary-fixed": "#410003",
                    "on-primary-fixed": "#002115",
                    "on-secondary-container": "#6b4200",
                    "outline": "#6d7a73",
                    "secondary-fixed-dim": "#ffb95d",
                    "on-surface": "#1a1c19",
                    "on-surface-variant": "#3d4943",
                    "inverse-on-surface": "#f1f1eb",
                    "on-primary-container": "#f5fff7"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1rem",
                    "3xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen">
<!-- Top Navigation Anchor -->
<header class="bg-[#faf9f4]/80 dark:bg-neutral-900/80 backdrop-blur-xl docked full-width top-0 sticky z-50 flex justify-between items-center px-6 py-4 w-full no-border shadow-none bg-surface-container-low">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Close up portrait of a professional Tanzanian man in a light green linen shirt, soft natural office lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAI3v_7NmZCpoCAW0RiUMMF2bQamiGG2P0Dgt4Uax69n8nfqdBq1R-jyVaXRWJzdf-A37L2UFZyNLl4siHcqBf5g69e0HbtUPN49acNs8_4Fe2xEJlq9jZ6xWSTSKZh6KFrmlmojisNwBJ91NEH2gXplZjPVuYlI2ihEOS46oo6pj5EkN6ua3HB6osNBD-taD-kIlEAjX8gwWmiX42fuRlnR_ZF8eTuBOKbftjCZDexRI2ZbxPw4-npShlpfN9Rjbtv1Yden9k1PKWq"/>
</div>
<span class="font-['Plus_Jakarta_Sans'] font-black tracking-tight text-[#00694c] dark:text-[#008560] text-xl">Fursafy</span>
</div>
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-neutral-500 hover:bg-neutral-200/50 dark:hover:bg-neutral-800/50 p-2 rounded-full active:scale-95 transition-transform" data-icon="notifications">notifications</button>
</div>
</header>
<main class="max-w-2xl mx-auto px-6 pt-8 pb-32">
<!-- Content behind the modal for context -->
<div class="space-y-8 opacity-40 select-none pointer-events-none">
<div class="space-y-2">
<h1 class="text-3xl font-extrabold tracking-tight text-on-surface">Review Application</h1>
<p class="text-on-surface-variant">Senior Marketing Lead • Dar es Salaam</p>
</div>
<div class="bg-surface-container-low rounded-3xl p-6 space-y-6">
<div class="flex items-center gap-4">
<div class="w-16 h-16 rounded-2xl bg-surface-container-high overflow-hidden">
<img alt="Applicant" class="w-full h-full object-cover" data-alt="Professional headshot of a smiling young woman with braided hair wearing business casual attire, warm studio lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWFKINiiITye2aj-UYVLZfQz081rTNcEX8edoGI80SxMXt0Llu1ZAfh1pKja72TvmhvKR-nv7daDauFM5ODwyEtBV4QInaTfMqSvjnwJQrbdn30trhEnb2IQtMf35CpUlRnoRPN0w99GbZB5P3uquMll8twHJhPzPPIRGj8QNBp6K7C0VSLgPXdvaaA3ypT9grq7WBuZIcoO8GRQBHN2pAkTW2wEvtwyn4FBWB5hnh5R3S3TwfZ2sQYfD7TEDn4iSGGY5f-G7Y4VBU"/>
</div>
<div>
<h2 class="text-xl font-bold">Juma Shabaan</h2>
<p class="text-sm text-on-surface-variant">Strategic Communications Specialist</p>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="p-4 bg-surface-container-lowest rounded-2xl">
<p class="text-[11px] uppercase font-bold text-neutral-400 tracking-widest mb-1">Experience</p>
<p class="font-semibold text-primary">6+ Years</p>
</div>
<div class="p-4 bg-surface-container-lowest rounded-2xl">
<p class="text-[11px] uppercase font-bold text-neutral-400 tracking-widest mb-1">Availability</p>
<p class="font-semibold text-primary">Immediate</p>
</div>
</div>
</div>
</div>
</main>
<!-- CONFIRMATION DIALOG (The Task) -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-6">
<!-- Backdrop -->
<div class="absolute inset-0 bg-on-surface/40 backdrop-blur-md"></div>
<!-- Dialog Container -->
<div class="relative w-full max-w-sm bg-surface-container-lowest rounded-3xl shadow-[0_24px_48px_rgba(0,0,0,0.12)] p-8 text-center flex flex-col items-center">
<!-- Icon/Visual Header -->
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<!-- Content -->
<h2 class="font-['Plus_Jakarta_Sans'] text-2xl font-extrabold text-on-surface mb-3">Accept Applicant?</h2>
<p class="font-['Manrope'] text-on-surface-variant leading-relaxed mb-8">
                This will hire <span class="font-bold text-on-surface">Juma Shabaan</span> for the job. We'll notify them immediately.
            </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-3">
<button class="w-full bg-primary text-on-primary py-4 px-6 rounded-full font-bold text-md active:scale-95 transition-transform shadow-lg shadow-primary/20">
                    Confirm
                </button>
<button class="w-full bg-transparent text-on-surface-variant py-3 px-6 rounded-full font-semibold text-md hover:bg-surface-container-high transition-colors active:scale-95">
                    Cancel
                </button>
</div>
</div>
</div>
<!-- Bottom Navigation Shell -->
<nav class="bg-[#faf9f4]/90 dark:bg-neutral-900/90 backdrop-blur-2xl fixed bottom-0 w-full rounded-t-[1.5rem] no-border bg-surface-container-lowest shadow-[0_-4px_20px_rgba(0,0,0,0.04)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pt-3 pb-6">
<button class="flex flex-col items-center justify-center text-neutral-400 dark:text-neutral-500 hover:text-[#00694c] transition-colors active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="home_max">home_max</span>
<span class="font-['Manrope'] text-[11px] font-semibold tracking-wide uppercase">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-[#00694c] dark:text-[#008560] bg-[#00694c]/10 rounded-xl px-4 py-1 active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="work_outline">work_outline</span>
<span class="font-['Manrope'] text-[11px] font-semibold tracking-wide uppercase">Work</span>
</button>
<button class="flex flex-col items-center justify-center text-neutral-400 dark:text-neutral-500 hover:text-[#00694c] transition-colors active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1 text-3xl" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-['Manrope'] text-[11px] font-semibold tracking-wide uppercase">Add</span>
</button>
<button class="flex flex-col items-center justify-center text-neutral-400 dark:text-neutral-500 hover:text-[#00694c] transition-colors active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="mail">mail</span>
<span class="font-['Manrope'] text-[11px] font-semibold tracking-wide uppercase">Inbox</span>
</button>
<button class="flex flex-col items-center justify-center text-neutral-400 dark:text-neutral-500 hover:text-[#00694c] transition-colors active:scale-90 transition-all duration-300 ease-out">
<span class="material-symbols-outlined mb-1" data-icon="person_outline">person_outline</span>
<span class="font-['Manrope'] text-[11px] font-semibold tracking-wide uppercase">Profile</span>
</button>
</nav>
</body></html>
