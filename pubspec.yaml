name: fursafy
description: "Fursa kwa Vijana — A job-matching platform for Tanzanian youth."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  firebase_analytics: ^12.4.2
  firebase_crashlytics: ^5.2.3
  firebase_remote_config: ^6.5.2

  # State Management (BLoC)
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.3.0

  # Local Storage
  hive_flutter: ^1.1.0

  # Maps & Location
  google_maps_flutter: ^2.12.1
  geolocator: ^14.0.3
  geocoding: ^4.0.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Utils
  uuid: ^4.5.1
  timeago: ^3.7.0
  flutter_local_notifications: ^18.0.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
