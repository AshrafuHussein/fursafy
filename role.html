<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6 sm:p-12">
<!-- Hero Content Cluster (Editorial Scale) -->
<header class="max-w-2xl w-full mb-12 sm:mb-16">
<div class="flex items-center gap-2 mb-8">
<div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<span class="font-headline font-black text-2xl tracking-tight text-primary">Fursafy</span>
</div>
<h1 class="text-4xl sm:text-5xl lg:text-6xl font-headline font-extrabold tracking-tight text-on-surface mb-6 leading-[1.1]">
            Your journey <br/>
<span class="text-primary">starts with a choice.</span>
</h1>
<p class="text-on-surface-variant text-lg max-w-md font-medium leading-relaxed">
            Select the role that fits your goals today. We'll curate the best opportunities just for you.
        </p>
</header>
<!-- Role Selection Grid (Asymmetrical Layout) -->
<main class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-5xl">
<!-- Youth Worker Role -->
<button class="group relative flex flex-col items-start p-8 sm:p-10 bg-surface-container-lowest rounded-[2rem] shadow-[0_20px_40px_rgba(0,0,0,0.02)] transition-all duration-300 hover:shadow-[0_30px_60px_rgba(0,0,0,0.06)] hover:-translate-y-1 text-left ring-1 ring-black/[0.03]">
<div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center mb-10 group-hover:bg-primary transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-on-primary text-3xl" data-icon="person_search" style="font-variation-settings: 'FILL' 1;">person_search</span>
</div>
<h2 class="text-2xl font-headline font-bold mb-3 text-on-surface">Youth Worker</h2>
<p class="text-on-surface-variant font-medium leading-relaxed mb-12">
                I am looking for meaningful work, apprenticeships, or gig opportunities to grow my career.
            </p>
<div class="mt-auto flex items-center gap-2 text-primary font-bold">
<span>Browse Jobs</span>
<span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_forward</span>
</div>
<!-- Decorative Illustration Element -->
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-8xl" data-icon="work">work</span>
</div>
</button>
<!-- Job Provider Role -->
<button class="group relative flex flex-col items-start p-8 sm:p-10 bg-surface-container-low rounded-[2rem] transition-all duration-300 hover:bg-surface-container-high hover:-translate-y-1 text-left ring-1 ring-black/[0.03]">
<div class="w-16 h-16 rounded-2xl bg-secondary-container/20 flex items-center justify-center mb-10 group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-on-secondary-container text-3xl" data-icon="business_center" style="font-variation-settings: 'FILL' 1;">business_center</span>
</div>
<h2 class="text-2xl font-headline font-bold mb-3 text-on-surface">Job Provider</h2>
<p class="text-on-surface-variant font-medium leading-relaxed mb-12">
                I am looking to hire talented youth, post job listings, or offer skill-building projects.
            </p>
<div class="mt-auto flex items-center gap-2 text-on-secondary-container font-bold">
<span>Post a Job</span>
<span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_forward</span>
</div>
<!-- Decorative Illustration Element -->
<div class="absolute top-0 right-0 p-4 opacity-5 group-hover:opacity-10 transition-opacity">
<span class="material-symbols-outlined text-8xl" data-icon="campaign">campaign</span>
</div>
</button>
</main>
<!-- Contextual Footer -->
<footer class="mt-16 w-full max-w-5xl flex flex-col md:flex-row justify-between items-center gap-8 border-t border-outline-variant/10 pt-8">
<div class="flex items-center gap-6">
<div class="flex -space-x-3">

<div class="w-10 h-10 rounded-full border-2 border-surface bg-primary-fixed-dim flex items-center justify-center text-xs font-bold text-on-primary-fixed">12k+</div>
</div>
<p class="text-sm font-label font-semibold text-on-surface-variant">Join 12,000+ others finding growth</p>
</div>
<div class="flex items-center gap-6 text-sm font-label font-bold text-on-surface-variant">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-primary transition-colors" href="#">Help Center</a>
</div>
</footer>
<!-- Decorative Background Accent -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-1/2 bg-gradient-to-bl from-primary/5 to-transparent blur-3xl rounded-full"></div>
<div class="fixed bottom-0 left-0 -z-10 w-1/4 h-1/3 bg-gradient-to-tr from-secondary-container/5 to-transparent blur-3xl rounded-full"></div>
